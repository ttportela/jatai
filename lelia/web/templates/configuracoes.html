{% extends "base.html" %}
{% block topbar %}Configurações{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Configurações gerais</h1>
  <p class="muted">Parâmetros globais do Lelia.</p>
</div>

<form method="post" action="/sistema/configuracoes" class="card form-stack">
  <label>Idioma da interface
    <select name="language">
      <option value="pt-BR" {% if settings.language == 'pt-BR' %}selected{% endif %}>Português (Brasil)</option>
      <option value="en" {% if settings.language == 'en' %}selected{% endif %}>English</option>
    </select>
  </label>
  <label>Tema
    <select name="theme">
      <option value="light" {% if settings.theme == 'light' %}selected{% endif %}>Claro</option>
      <option value="dark" {% if settings.theme == 'dark' %}selected{% endif %}>Escuro</option>
    </select>
  </label>
  <label>Porta do servidor
    <input type="number" name="port" value="{{ settings.port }}" min="1" max="65535">
  </label>
  <label>Diretório-base de armazenamento
    <input type="text" value="{{ settings.base_dir }}" disabled>
    <span class="muted small">Configurado via LELIA_HOME (padrão ~/.lelia)</span>
  </label>
  <label>CORE API key (opcional — habilita o provider CORE)
    <input type="password" name="core_api_key" value="{{ settings.core_api_key or '' }}" autocomplete="off">
    <span class="muted small">Usada apenas para consultas de metadados ao api.core.ac.uk</span>
  </label>
  <button class="btn" type="submit">Salvar</button>
</form>
{% endblock %}
