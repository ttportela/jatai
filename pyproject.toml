[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jatai"
version = "0.1.0"
description = "Jataí — local research agent for scientific publications"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Tarlis Tortelli" }]
urls = { Repository = "https://github.com/tarlis/jatai" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9",
    "playwright>=1.40",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
jatai = "jatai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jatai"]
